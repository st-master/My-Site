<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Site - 文書ギャラリー</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f9f9f9;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    .gallery-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 20px;
      background: #ffffff;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
    }
    .card-title a {
      font-size: 1.1rem;
      font-weight: bold;
      color: #007acc;
      text-decoration: none;
      word-break: break-all;
    }
    .card-title a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>文書ギャラリー</h1>
  <div id="gallery" class="gallery-container">ファイルを読み込んでいます...</div>

  <script>
    const USER = 'st-master';
    const REPO = 'My-Site';
    const FOLDER = 'documents';

    async function loadDocuments() {
      const galleryEl = document.getElementById('gallery');
      try {
        const response = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${FOLDER}`);
        const files = await response.json();
        
        galleryEl.innerHTML = '';

        for (const file of files) {
          if (file.name.endsWith('.md') || file.name.endsWith('.html')) {
            const card = document.createElement('div');
            card.className = 'card';
            
            const title = document.createElement('div');
            title.className = 'card-title';

            // クリックで直接ファイルが開くリンクを作成
            const link = document.createElement('a');
            link.href = `./${FOLDER}/${file.name}`;
            link.textContent = file.name;
            link.target = '_blank'; // 新しいタブで開く場合（不要なら削除可）

            title.appendChild(link);
            card.appendChild(title);
            galleryEl.appendChild(card);
          }
        }
      } catch (error) {
        galleryEl.innerHTML = '文書の取得に失敗しました。';
        console.error(error);
      }
    }

    loadDocuments();
  </script>
</body>
</html>
