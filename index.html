<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Site - 文書ギャラリー</title>
  <!-- MarkdownをHTMLに変換するライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f9f9f9;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    .gallery-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .card {
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 20px;
      background: #ffffff;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      max-height: 450px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 10px;
      padding-bottom: 5px;
      border-bottom: 2px solid #007acc;
      color: #007acc;
    }
    .card-content {
      font-size: 0.9rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <h1>文書ギャラリー</h1>
  <div id="gallery" class="gallery-container">ファイルを読み込んでいます...</div>

  <script>
    const USER = 'st-master';
    const REPO = 'My-Site';
    const FOLDER = 'documents';

    async function loadDocuments() {
      const galleryEl = document.getElementById('gallery');
      try {
        // GitHub APIで documents フォルダ内のファイルを取得
        const response = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${FOLDER}`);
        const files = await response.json();
        
        galleryEl.innerHTML = ''; // 読み込み中表示をクリア

        for (const file of files) {
          // .md または .html ファイルを対象にする
          if (file.name.endsWith('.md') || file.name.endsWith('.html')) {
            const contentRes = await fetch(file.download_url);
            const rawText = await contentRes.text();

            let renderedHtml = '';
            if (file.name.endsWith('.md')) {
              // MarkdownをHTMLに変換
              renderedHtml = marked.parse(rawText);
            } else {
              // HTMLファイルはそのまま表示
              renderedHtml = rawText;
            }

            // カード要素を作成
            const card = document.createElement('div');
            card.className = 'card';
            
            const title = document.createElement('div');
            title.className = 'card-title';
            title.textContent = file.name;

            const content = document.createElement('div');
            content.className = 'card-content';
            content.innerHTML = renderedHtml;

            card.appendChild(title);
            card.appendChild(content);
            galleryEl.appendChild(card);
          }
        }
      } catch (error) {
        galleryEl.innerHTML = '文書の取得に失敗しました。';
        console.error(error);
      }
    }

    loadDocuments();
  </script>
</body>
</html>
