<!-- index.html やギャラリー用ページに配置 -->
<div id="audio-gallery" class="gallery-grid"></div>

<script>
async function loadGallery(folderName, containerId) {
  const container = document.getElementById(containerId);
  const repoOwner = "st-master";
  const repoName = "My-Site";
  
  try {
    // GitHub APIで指定フォルダー内のファイル一覧を取得
    const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${folderName}`);
    const files = await response.json();

    container.innerHTML = ""; // 初期化

    files.forEach(file => {
      // 画像・動画ファイルのみ判定して要素を生成
      if (file.type === "file" && file.name.match(/\.(jpg|jpeg|png|webp|gif|mp4|webm)$/i)) {
        const itemEl = document.createElement("div");
        itemEl.className = "gallery-item";

        if (file.name.match(/\.(mp4|webm)$/i)) {
          itemEl.innerHTML = `<video controls src="${file.download_url}" width="100%"></video>`;
        } else {
          itemEl.innerHTML = `<img src="${file.download_url}" alt="${file.name}" style="max-width: 100%;" />`;
        }
        
        container.appendChild(itemEl);
      }
    });
  } catch (error) {
    console.error("ギャラリーの読み込みに失敗しました:", error);
  }
}

// ページ読み込み時に実行
document.addEventListener("DOMContentLoaded", () => {
  loadGallery("images", "image-gallery");
});
</script>
